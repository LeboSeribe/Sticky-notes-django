<!-- notes/templates/notes/note_detail.html -->
{% extends 'base.html' %}

{% block title %}Sticky Notes - {{ note.title }}{% endblock %}

{% block content %}
  <h2>{{ note.title }}</h2>
  <p>{{ note.content }}</p>
  <p><small>Created: {{ note.created_at }} | Last updated: {{ note.updated_at }}</small></p>

  <a href="{% url 'note_update' pk=note.pk %}">Edit Note</a>
  <a href="{% url 'note_delete' pk=note.pk %}">Delete Note</a>
  <a href="{% url 'note_list' %}">Back to All Notes</a>
{% endblock %}
