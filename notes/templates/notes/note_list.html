<!-- notes/templates/notes/note_list.html -->
{% extends 'base.html' %}

{% block title %}Sticky Notes - {{ page_title }}{% endblock %}

{% block content %}
  <h2>{{ page_title }}</h2>

  <div class="note-board">
    {% for note in notes %}
      <div class="sticky-note">
        <h3><a href="{% url 'note_detail' pk=note.pk %}">{{ note.title }}</a></h3>
        <p>{{ note.content|truncatewords:20 }}</p>
        <div class="note-actions">
          <a href="{% url 'note_update' pk=note.pk %}">Edit</a>
          <a href="{% url 'note_delete' pk=note.pk %}">Delete</a>
        </div>
      </div>
    {% empty %}
      <p>No notes yet. <a href="{% url 'note_create' %}">Create your first note.</a></p>
    {% endfor %}
  </div>
{% endblock %}
