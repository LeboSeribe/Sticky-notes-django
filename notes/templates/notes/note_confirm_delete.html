<!-- notes/templates/notes/note_confirm_delete.html -->
{% extends 'base.html' %}

{% block title %}Sticky Notes - Delete Note{% endblock %}

{% block content %}
  <h2>Delete "{{ note.title }}"?</h2>
  <p>This action cannot be undone.</p>

  <form method="post">
    {% csrf_token %}
    <button type="submit">Yes, delete it</button>
  </form>
  <a href="{% url 'note_detail' pk=note.pk %}">Cancel</a>
{% endblock %}
